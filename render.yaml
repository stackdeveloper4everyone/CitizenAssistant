# Render Blueprint — Citizen Service Assistant
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint → connect repo.
# Set secret env vars when prompted (sync: false).

services:
  - type: web
    name: citizen-service-assistant
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Must be fully qualified; new Render services default to 3.14 without this.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically; uvicorn reads it via $PORT in startCommand.
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "true"
      # Lighter embedding model for Render free tier (512 MB RAM). Set QDRANT_USE_HASH_FALLBACK=true if deploy OOMs.
      - key: QDRANT_EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      # Skip FastEmbed model download at boot so the service binds PORT quickly on free tier.
      - key: QDRANT_USE_HASH_FALLBACK
        value: "true"
      - key: SARVAM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: MEM0_ORG_ID
        sync: false
      - key: MEM0_PROJECT_ID
        sync: false
      # Comma-separated extra origins (optional). RENDER_EXTERNAL_URL is added automatically in code.
      - key: ALLOWED_ORIGINS
        sync: false
